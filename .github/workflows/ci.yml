name: SKYNET CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

  build-ts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
        env:
          CI: true

  build-wasm:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/core-wasm-engine
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Download wasm-bindgen-cli
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)  WB="x86_64-unknown-linux-musl" ;;
            macOS)
              ARCH=$(uname -m)
              if [ "$ARCH" = "arm64" ]; then WB="aarch64-apple-darwin"; else WB="x86_64-apple-darwin"; fi
              ;;
            Windows) WB="x86_64-pc-windows-msvc" ;;
          esac
          mkdir -p "$RUNNER_TEMP/wasm-bindgen"
          cd "$RUNNER_TEMP/wasm-bindgen"
          curl -LO "https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.122/wasm-bindgen-0.2.122-${WB}.tar.gz"
          tar xzf "wasm-bindgen-0.2.122-${WB}.tar.gz"
          echo "$RUNNER_TEMP/wasm-bindgen/wasm-bindgen-0.2.122-${WB}" >> $GITHUB_PATH
      - name: Build WASM
        shell: bash
        run: node build.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dist-${{ matrix.os }}
          path: packages/core-wasm-engine/dist/

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
        env:
          CI: true
